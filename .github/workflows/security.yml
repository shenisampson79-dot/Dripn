name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security smoke
        run: npm run security:smoke
        env:
          # Skip live health if network flaky; release smoke still runs static checks
          DRIPN_API_BASE: https://dripn-server.onrender.com

      - name: Secret scan
        run: npm run security:scan-secrets

      - name: npm audit (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: false
