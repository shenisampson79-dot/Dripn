name: Live Permanent Regression

on:
  push:
    branches: [main, master, 'cursor/**']
  pull_request:

jobs:
  live-regression:
    name: L1–L6 Live launch gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Live permanent regression (L1–L6)
        run: npm run test:live-regression
